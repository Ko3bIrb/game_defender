<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защитник — Главное меню</title>
    
    <!-- Фавиконка -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='sky' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%231a0505'/%3E%3Cstop offset='0.6' stop-color='%234a1005'/%3E%3Cstop offset='1' stop-color='%232a0500'/%3E%3C/linearGradient%3E%3ClinearGradient id='stone' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23a89880'/%3E%3Cstop offset='1' stop-color='%234a3a28'/%3E%3C/linearGradient%3E%3ClinearGradient id='fire' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffe066'/%3E%3Cstop offset='0.5' stop-color='%23ff6622'/%3E%3Cstop offset='1' stop-color='%23aa1100'/%3E%3C/linearGradient%3E%3CradialGradient id='glow' cx='0.5' cy='0.5' r='0.5'%3E%3Cstop offset='0' stop-color='%23ffaa22' stop-opacity='0.9'/%3E%3Cstop offset='1' stop-color='%23ff2200' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='url(%23sky)'/%3E%3Ccircle cx='32' cy='24' r='22' fill='url(%23glow)'/%3E%3Cpath d='M 14 58 L 14 30 L 18 30 L 18 26 L 22 26 L 22 30 L 26 30 L 26 24 L 30 24 L 30 30 L 34 30 L 34 24 L 38 24 L 38 30 L 42 30 L 42 26 L 46 26 L 46 30 L 50 30 L 50 58 Z' fill='url(%23stone)' stroke='%231a0a05' stroke-width='1.2' stroke-linejoin='round'/%3E%3Crect x='20' y='42' width='6' height='10' fill='%231a0505'/%3E%3Crect x='38' y='42' width='6' height='10' fill='%231a0505'/%3E%3Cpath d='M 30 44 L 34 44 L 33 52 L 31 52 Z' fill='%23ffaa22' opacity='0.85'/%3E%3Cpath d='M 32 8 C 28 14 26 18 27 22 C 28 24 30 22 30 20 C 31 23 33 23 34 21 C 35 19 34 16 33 14 C 35 15 36 18 35 21 C 37 20 38 16 36 12 C 35 10 34 9 32 8 Z' fill='url(%23fire)'/%3E%3Cpath d='M 32 14 C 30 17 30 19 31 20 C 32 20.5 32.5 19 32 18 C 32.6 18.6 33.2 19.4 32.8 20.6 C 33.5 19.8 33.6 18 32.6 16 Z' fill='%23fff2b0'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* ─── БАЗОВЫЕ НАСТРОЙКИ ─── */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #050208;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* ─── СТАТИЧНЫЙ ФОН (КРЕПОСТЬ ПОД ФИОЛЕТОВОЙ БУРЕЙ) ─── */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            /* Замените ссылку ниже на прямую ссылку на понравившееся изображение */
            background-image: url('https://images.wallpaper.cam/2026/09/fortress-under-purple-storm-4k.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Затемняющий слой для читаемости текста и неонового свечения */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(20, 10, 35, 0.4) 0%, rgba(5, 2, 10, 0.85) 100%);
        }

        /* ─── UI МЕНЮ (Стекло + Неон) ─── */
        .menu-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(15, 7, 25, 0.7);
            border: 2px solid rgba(154, 61, 255, 0.5);
            border-radius: 24px;
            padding: 50px 70px;
            box-shadow: 0 0 60px rgba(154, 61, 255, 0.2), inset 0 0 30px rgba(154, 61, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: menu-appear 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes menu-appear {
            from { transform: translateY(40px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .menu-title {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 
                0 0 10px rgba(255,255,255,0.8),
                0 0 20px #9a3dff,
                0 0 40px #9a3dff,
                0 0 80px #9a3dff;
            animation: title-pulse 3s infinite alternate;
        }

        @keyframes title-pulse {
            0% { text-shadow: 0 0 10px #fff, 0 0 20px #9a3dff, 0 0 40px #9a3dff; }
            100% { text-shadow: 0 0 15px #fff, 0 0 30px #00c8ff, 0 0 60px #00c8ff; }
        }

        .menu-subtitle {
            font-size: 14px;
            color: #00c8ff;
            letter-spacing: 6px;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .menu-btn {
            display: block;
            width: 320px;
            padding: 18px 20px;
            margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #9a3dff;
            border-radius: 12px;
            color: #e8d4ff;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(154, 61, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(154, 61, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .menu-btn:hover {
            background: rgba(154, 61, 255, 0.15);
            box-shadow: 0 0 30px rgba(154, 61, 255, 0.6);
            border-color: #00c8ff;
            color: #fff;
            transform: scale(1.05);
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn.play-btn {
            border-color: #39ff5a;
            color: #39ff5a;
            box-shadow: 0 0 20px rgba(57, 255, 90, 0.3);
            font-size: 22px;
            padding: 22px 20px;
            margin-bottom: 25px;
        }

        .menu-btn.play-btn:hover {
            background: rgba(57, 255, 90, 0.15);
            box-shadow: 0 0 40px rgba(57, 255, 90, 0.8);
            border-color: #fff;
            color: #fff;
        }

        /* ─── МОДАЛКА ВЫБОРА КАРТЫ ─── */
        #menu-maps-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 2, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #menu-maps-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-maps-box {
            background: rgba(20, 10, 35, 0.95);
            border: 2px solid #9a3dff;
            border-radius: 20px;
            padding: 40px;
            width: 90vw;
            max-width: 800px;
            box-shadow: 0 0 80px rgba(154, 61, 255, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        #menu-maps-modal.active .menu-maps-box {
            transform: translateY(0);
        }

        .menu-maps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .menu-map-card {
            background: rgba(10, 5, 15, 0.8);
            border: 2px solid rgba(154, 61, 255, 0.3);
            border-radius: 16px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .menu-map-card:hover { transform: translateY(-5px); }

        #card-hell:hover { border-color: #ff3b3b; box-shadow: 0 0 30px rgba(255, 59, 59, 0.4); }
        #card-hell.selected { border-color: #ff3b3b; box-shadow: 0 0 30px rgba(255, 59, 59, 0.6), inset 0 0 20px rgba(255, 59, 59, 0.2); }
        
        #card-ice:hover { border-color: #00c8ff; box-shadow: 0 0 30px rgba(0, 200, 255, 0.4); }
        #card-ice.selected { border-color: #00c8ff; box-shadow: 0 0 30px rgba(0, 200, 255, 0.6), inset 0 0 20px rgba(0, 200, 255, 0.2); }

        .menu-map-card.selected::after {
            content: '✓ ВЫБРАНО';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        .menu-map-icon { font-size: 54px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3)); }
        .menu-map-name { font-size: 22px; font-weight: 800; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; }
        .menu-map-desc { font-size: 13px; color: rgba(232, 212, 255, 0.7); line-height: 1.4; }

        .menu-close-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid rgba(232, 212, 255, 0.4);
            border-radius: 10px;
            color: rgba(232, 212, 255, 0.8);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .menu-close-btn:hover {
            background: rgba(232, 212, 255, 0.1);
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Фон с крепостью -->
    <div class="bg-container">
        <div class="bg-overlay"></div>
    </div>

    <!-- Основное меню -->
    <div class="menu-container">
        <div class="menu-title">Защитник</div>
        <div class="menu-subtitle">Оборона последнего рубежа</div>

        <button class="menu-btn play-btn" onclick="startGame()">▶ Играть</button>
        <button class="menu-btn" onclick="openMapsModal()">🗺️ Выбрать карту</button>
    </div>

    <!-- Модалка выбора карты -->
    <div id="menu-maps-modal">
        <div class="menu-maps-box">
            <h2 style="color: var(--gold); text-align: center; margin-top: 0; margin-bottom: 30px; font-size: 28px; letter-spacing: 3px; text-transform: uppercase;">Выбери карту</h2>
            <div class="menu-maps-grid">
                
                <div class="menu-map-card" id="card-hell" onclick="selectMap('hell')">
                    <div class="menu-map-icon">🔥</div>
                    <div class="menu-map-name">Последний Бастион</div>
                    <div class="menu-map-desc">Огненные демоны, лава и пепел. Классический вызов.</div>
                </div>

                <div class="menu-map-card" id="card-ice" onclick="selectMap('ice')">
                    <div class="menu-map-icon">❄️</div>
                    <div class="menu-map-name">Ледяной Предел</div>
                    <div class="menu-map-desc">Снежные твари, лёд и вьюга. Сумеречная карта.</div>
                </div>

            </div>
            <button class="menu-close-btn" onclick="closeMapsModal()">Закрыть</button>
        </div>
    </div>

    <script>
        let selectedMap = localStorage.getItem('selected_map') || 'hell';

        document.addEventListener('DOMContentLoaded', () => {
            updateCardHighlight();
        });

        function openMapsModal() {
            document.getElementById('menu-maps-modal').classList.add('active');
        }

        function closeMapsModal() {
            document.getElementById('menu-maps-modal').classList.remove('active');
        }

        function selectMap(mapId) {
            selectedMap = mapId;
            localStorage.setItem('selected_map', mapId);
            updateCardHighlight();
            setTimeout(closeMapsModal, 300);
        }

        function updateCardHighlight() {
            document.getElementById('card-hell').classList.toggle('selected', selectedMap === 'hell');
            document.getElementById('card-ice').classList.toggle('selected', selectedMap === 'ice');
        }

        function startGame() {
            if (selectedMap === 'ice') {
                window.location.href = 'html/game/game-ice.html';
            } else {
                window.location.href = 'html/game/game-hell.html';
            }
        }
    </script>
</body>
</html>
